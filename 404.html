</div>
<main id="main">
    <div class="erreur-404">
        <div class="erreur-illustration" aria-hidden="true">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <div class="glitch-titre" role="heading" aria-level="1" aria-label="404"><span class="glitch-chiffre"
                                                                                       data-text="4">4</span><span
                class="glitch-chiffre" data-text="0">0</span><span class="glitch-chiffre" data-text="4">4</span></div>

        <a href="./index.html" class="btn-accueil"><i class="fas fa-home" aria-hidden="true"></i> Retour à l'accueil</a>
    </div>
</main>

<script>
    (function () {
        const conteneur = document.querySelector('.erreur-404');
        if (!conteneur || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const fragments = ['{ }', '//', '< >', '&&', '==', '!=', '0x', '**', '();', '[]', 'null', 'err', '>>'];
        for (let i = 0; i < 18; i++) {
            const el = document.createElement('span');
            el.className = 'particule-404';
            el.textContent = fragments[Math.floor(Math.random() * fragments.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.top = (60 + Math.random() * 50) + '%';
            el.style.animationDelay = (Math.random() * 20) + 's';
            el.style.animationDuration = (15 + Math.random() * 15) + 's';
            el.style.fontSize = (0.7 + Math.random() * 0.6) + 'rem';
            conteneur.appendChild(el);
        }
    })();
</script>
