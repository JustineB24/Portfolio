<!--    ==========================================================    -->
<!--    | * Générateur des cartes de partage (Open Graph)         |    -->
<!--    | * Auteur : Justine BLIN                                 |    -->
<!--    |                                                          |    -->
<!--    | Page outil, non liée depuis le site. Elle sert à         |    -->
<!--    | régénérer les images og-*.jpg de ce dossier.             |    -->
<!--    |                                                          |    -->
<!--    | Les textes se passent en paramètres d'URL :              |    -->
<!--    |   generateur.html?eyebrow=Formation&titre=BTS%20SIO      |    -->
<!--    |     &accroche=Une%20phrase&icone=fas%20fa-graduation-cap |    -->
<!--    |                                                          |    -->
<!--    | Pour exporter en 1200x630 (format attendu par LinkedIn   |    -->
<!--    | et X), depuis la racine du dépôt :                       |    -->
<!--    |   python3 -m http.server 8000                            |    -->
<!--    |   chrome --headless --window-size=1200,630 \             |    -->
<!--    |     --screenshot=carte.png "http://localhost:8000/…"     |    -->
<!--    |   sips -s format jpeg -s formatOptions 88 carte.png \    |    -->
<!--    |     --out assets/og/og-nom.jpg                           |    -->
<!--    ==========================================================    -->

<!--
    ==========================================================================
    OÙ SONT LES TEXTES DES CARTES
    ==========================================================================
    Dans l'objet `CARTES` en bas de ce fichier : c'est la SEULE source de
    vérité. Volontairement pas recopiés ici, un commentaire finirait par
    diverger (c'est déjà arrivé aux images elles-mêmes).

    Ouvrir generateur.html sans paramètre affiche la liste des cartes.

    ==========================================================================
    RÉGÉNÉRER UNE CARTE
    ==========================================================================
      cd <racine du dépôt> && python3 -m http.server 8000 &
      NOM=formation      # une des clés de l'objet CARTES
      chrome --headless --disable-gpu --hide-scrollbars \
             --virtual-time-budget=7000 --window-size=1200,630 \
             --screenshot=/tmp/carte.png \
             "http://localhost:8000/assets/og/generateur.html?carte=$NOM"
      sips -s format jpeg -s formatOptions 88 /tmp/carte.png \
           --out "assets/og/og-$NOM.jpg"

    Qualité 88 : les dégradés du fond sont coûteux, en dessous ils marbrent.

    Une carte est une image, elle ne suit pas les modifications des pages.
    Quand un eyebrow ou un titre de page change : corriger `CARTES`, PUIS
    régénérer l'image.

    Les paramètres eyebrow / titre / accroche / icone restent acceptés, seuls
    ou en surcharge d'une carte nommée, pour essayer une variante sans
    toucher au fichier.
    ==========================================================================
-->

<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Carte sociale</title>
    <link rel="stylesheet" href="../fonts/fa/css/all.min.css">
    <link rel="stylesheet" href="../fonts/google/fonts.css">
    <style>
        /* Carte Open Graph — 1200x630, l'aspect attendu par LinkedIn et X.
           Reprend l'identité du site : fond anthracite, rouge de marque,
           Raleway pour le titre, Inter pour le corps, et le motif
           eyebrow + titre + filet déjà utilisé sur les pages. */
        :root {
            --rouge: #960000;
            --rouge-clair: #ca8080;
            --fond: #121212;
            --texte: #e6e6e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1200px;
            height: 630px;
        }

        body {
            position: relative;
            overflow: hidden;
            background: var(--fond);
            font-family: 'Inter', sans-serif;
            color: var(--texte);
        }

        /* Halo rouge en diagonale : rappelle le header rouge sans l'imiter */
        .halo {
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 100% at 100% 0%, rgba(150, 0, 0, 0.55) 0%, rgba(150, 0, 0, 0) 60%),
            radial-gradient(80% 80% at 0% 100%, rgba(150, 0, 0, 0.18) 0%, rgba(150, 0, 0, 0) 70%);
        }

        /* Trame de points discrète, clin d'œil au pixel-art du logo */
        .trame {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(230, 230, 230, 0.07) 1.5px, transparent 1.5px);
            background-size: 26px 26px;
        }

        .bande {
            position: absolute;
            top: 0;
            left: 0;
            width: 14px;
            height: 100%;
            background: var(--rouge);
        }

        .carte {
            position: relative;
            height: 100%;
            padding: 72px 80px 64px 96px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .haut {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 48px;
        }

        .eyebrow {
            font-family: 'Raleway', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--rouge-clair);
            margin-bottom: 22px;
        }

        .titre {
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.04;
            font-size: 86px;
            max-width: 800px;
            overflow-wrap: break-word;
        }

        /* Titres longs : on descend d'un cran pour rester sur deux lignes */
        body.titre-long .titre {
            font-size: 68px;
        }

        .filet {
            width: 132px;
            height: 7px;
            border-radius: 7px;
            background: var(--rouge);
            margin-top: 30px;
        }

        .accroche {
            font-size: 27px;
            line-height: 1.45;
            color: #b9b9b9;
            max-width: 760px;
            margin-top: 30px;
        }

        /* Grande icône fantôme à droite : identifie la page d'un coup d'œil */
        .icone {
            font-size: 210px;
            line-height: 1;
            color: rgba(202, 128, 128, 0.22);
            flex-shrink: 0;
        }

        .bas {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .bas img {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nom {
            font-family: 'Raleway', sans-serif;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .role {
            font-size: 22px;
            color: #a8a8a8;
            margin-top: 4px;
        }

        .url {
            margin-left: auto;
            font-family: 'Raleway', sans-serif;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--rouge-clair);
        }
    </style>
</head>
<body>
<div class="halo"></div>
<div class="trame"></div>
<div class="bande"></div>

<div class="carte">
    <div class="haut">
        <div>
            <p class="eyebrow" id="eyebrow">Portfolio</p>
            <h1 class="titre" id="titre">Titre</h1>
            <div class="filet"></div>
            <p class="accroche" id="accroche"></p>
        </div>
        <i class="icone" id="icone" aria-hidden="true"></i>
    </div>

    <div class="bas">
        <img src="../Logo_portfolio.png" alt="">
        <div>
            <div class="nom">Justine Blin</div>
            <div class="role" id="role">Développeuse web</div>
        </div>
        <div class="url">justineb24.github.io/Portfolio</div>
    </div>
</div>

<script>
    // ======================================================================
    // SOURCE UNIQUE DE VÉRITÉ des 10 cartes.
    //
    // La clé est le suffixe du fichier : "formation" -> og-formation.jpg.
    // Règle de contenu : `eyebrow` et `titre` reprennent l'eyebrow et le h1
    // de la page, pour que la carte et la page racontent la même chose.
    //
    // À GARDER À JOUR : une carte est une image, elle ne suit pas les
    // modifications des pages. Quand un eyebrow ou un titre de page change,
    // corriger ici PUIS régénérer l'image (voir l'en-tête du fichier).
    // ======================================================================
    const CARTES = {
        "accueil": {
            eyebrow: "Développeuse web",
            titre: "Justine Blin",
            accroche: "Portfolio : projets, compétences et parcours en développement web.",
            icone: "fas fa-code"
        },
        "apropos": {
            eyebrow: "Parcours et expériences",
            titre: "Profil",
            accroche: "Formations, expériences professionnelles et CV.",
            icone: "fas fa-user"
        },
        "competences": {
            eyebrow: "Langages, outils et certifications",
            titre: "Compétences",
            // Reprend le sous-titre réel de la page. L'ancienne accroche, « Ce que
            // j'utilise, et où le voir en projet », promettait des liens de preuve
            // vers les projets qui ont été retirés de la page le 06/08.
            accroche: "Du site web à l'application mobile, avec la base de données et le déploiement derrière.",
            icone: "fas fa-laptop-code"
        },
        "projets": {
            eyebrow: "Du BTS SIO à l'alternance",
            titre: "Mes projets",
            accroche: "Projets de Bachelor, de BTS SIO, de stage et personnels.",
            icone: "fas fa-folder-open"
        },
        // eyebrow et titre volontairement inversés par rapport à la page :
        // « Raspberry Pi » en grand est plus parlant dans un flux.
        "veille": {
            eyebrow: "Sujet suivi",
            titre: "Raspberry Pi",
            accroche: "Historique, innovations et applications d'un nano-ordinateur.",
            icone: "fas fa-rss"
        },
        "formation": {
            eyebrow: "Développement, data et IA",
            titre: "Formation",
            accroche: "Mastère Expert IT à venir, Bachelor Chef de projet développement et data, BTS SIO option SLAM.",
            icone: "fas fa-graduation-cap"
        },
        "contact": {
            eyebrow: "Oise (60), Hauts-de-France",
            titre: "Contact",
            accroche: "Pour discuter d'un projet ou d'une collaboration.",
            icone: "fas fa-paper-plane"
        },
        "mentions-legales": {
            eyebrow: "Aucun cookie, aucune donnée collectée",
            titre: "Mentions légales",
            accroche: "Éditeur, hébergement et données personnelles.",
            icone: "fas fa-scale-balanced"
        },
        // Carte générique : la page est dynamique (?id=…) et projet-details.js
        // remplace og:image par la 1re capture du projet quand il en a une.
        "projet-details": {
            eyebrow: "Réalisations",
            titre: "Détail d'un projet",
            accroche: "Contexte, technologies et étude de cas.",
            icone: "fas fa-diagram-project"
        },
        "404": {
            eyebrow: "Erreur 404",
            titre: "Page introuvable",
            accroche: "Cette page n'existe pas ou a été déplacée.",
            icone: "fas fa-triangle-exclamation"
        }
    };

    const p = new URLSearchParams(location.search);
    const nom = p.get('carte');

    // Sans paramètre : on liste les cartes disponibles au lieu d'afficher
    // une carte vide, pour qu'on n'ait pas à ouvrir le code pour les trouver.
    if (!nom && !p.get('titre')) {
        document.body.innerHTML =
            '<div style="padding:3rem;font:16px/1.7 monospace;color:#e6e6e6">' +
            '<p style="color:#ca8080;font-weight:700">generateur.html?carte=&lt;nom&gt;</p>' +
            '<p>Cartes disponibles :</p><ul>' +
            Object.keys(CARTES).map(function (c) {
                return '<li><a style="color:#ca8080" href="?carte=' + c + '">' + c +
                    '</a> &nbsp;&rarr;&nbsp; og-' + c + '.jpg</li>';
            }).join('') +
            '</ul><p>Les paramètres eyebrow / titre / accroche / icone restent ' +
            'acceptés, seuls ou en surcharge d\'une carte.</p></div>';
        throw new Error('liste affichée');   // stoppe le reste du script
    }

    if (nom && !CARTES[nom]) {
        document.title = 'CARTE INCONNUE';
        document.body.innerHTML =
            '<p style="padding:3rem;font:16px monospace;color:#ca8080">Carte inconnue : ' +
            nom.replace(/[<>&]/g, '') + '<br>Attendu : ' + Object.keys(CARTES).join(', ') + '</p>';
        throw new Error('carte inconnue');
    }

    // Une carte nommée fournit les valeurs par défaut ; chaque paramètre
    // d'URL peut encore les surcharger, pratique pour essayer une variante.
    const base = CARTES[nom] || {};
    const valeur = (cle) => p.get(cle) !== null ? p.get(cle) : base[cle];

    const mettre = (id, v) => {
        if (v !== undefined && v !== null) document.getElementById(id).textContent = v;
    };
    mettre('eyebrow', valeur('eyebrow'));
    mettre('titre', valeur('titre'));
    mettre('accroche', valeur('accroche'));
    mettre('role', p.get('role'));

    const icone = valeur('icone');
    if (icone) document.getElementById('icone').className = 'icone ' + icone;

    const titre = valeur('titre') || '';
    if (titre.length > 18) document.body.classList.add('titre-long');
</script>
</body>
</html>
