<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez Justine BLIN pour toute question ou opportunité professionnelle.">
    <meta name="author" content="Justine BLIN">
    <meta name="theme-color" content="#a90000">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portfolio | Contact">
    <meta property="og:description"
          content="Contactez Justine BLIN pour toute question ou opportunité professionnelle.">
    <meta property="og:image" content="https://justineb24.github.io/Portfolio/assets/Logo_portfolio.png">
    <meta property="og:url" content="https://justineb24.github.io/Portfolio/pages/contact.html">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Portfolio | Contact">
    <meta name="twitter:description"
          content="Contactez Justine BLIN pour toute question ou opportunité professionnelle.">
    <meta name="twitter:image" content="https://justineb24.github.io/Portfolio/assets/Logo_portfolio.png">
    <link rel="icon" type="image/png" href="../assets/Logo_portfolio.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/global.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/theme.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/contact.css" media="all" type="text/css">
    <script>try {
        let dm = localStorage.getItem('dark-mode');
        if (dm === 'true' || (dm === null && window.matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.classList.add('dark-theme')
    } catch (e) {
    }</script>
    <script src="../js/structure-globale.js" defer></script>

    <title>Portfolio | Contact</title>
</head>

<body>
<div class="loader"><img class="loader-logo" src="../assets/Logo_portfolio.png" alt="Chargement" width="80" height="80">
</div>
<!-- Contenu principal -->
<main id="main">
    <h1><i class="fas fa-paper-plane" aria-hidden="true"></i> Contact</h1>
    <p class="contact-intro">N'hésitez pas à me contacter pour discuter d'un projet ou d'une collaboration.</p>

    <!-- Contenu principal contact -->
    <section class="contact-section">
        <div class="contact-grid">
            <!-- Formulaire -->
            <div class="contact-form-wrapper scroll-reveal">
                <form class="contact-form" id="contact-form">
                    <p class="note-obligatoire">* Champs obligatoires</p>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="nom" name="nom" required placeholder=" " autocomplete="name">
                            <label for="nom">Nom <span class="requis">*</span></label>
    
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" name="email" required placeholder=" " autocomplete="email">
                            <label for="email">Email <span class="requis">*</span></label>
    
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="sujet" name="sujet" required placeholder=" ">
                        <label for="sujet">Sujet <span class="requis">*</span></label>

                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="6" required placeholder=" "></textarea>
                        <label for="message">Message <span class="requis">*</span></label>

                    </div>
                    <div class="contact-form-footer">
                        <button type="submit" class="btn-envoyer">
                            <i class="fas fa-paper-plane" aria-hidden="true"></i> Envoyer
                        </button>
                        <p class="contact-info-mailto"><small>L'envoi ouvrira votre application de messagerie.</small>
                        </p>
                    </div>
                </form>
            </div>

            <!-- Infos de contact -->
            <aside class="contact-aside scroll-reveal">
                <h2>Moyens de contact</h2>

                <div class="contact-cards">
                    <a href="mailto:blin.justine.sio@gmail.com" class="contact-card">
                        <div class="contact-card-icon">
                            <i class="fas fa-envelope" aria-hidden="true"></i>
                        </div>
                        <div class="contact-card-text">
                            <span class="contact-card-label">Email</span>
                            <span class="contact-card-value">blin.justine.sio@gmail.com</span>
                        </div>
                        <i class="fas fa-arrow-right contact-card-arrow" aria-hidden="true"></i>
                    </a>

                    <a href="https://www.linkedin.com/in/justine-blin-a88600292" target="_blank"
                       rel="noopener noreferrer" class="contact-card">
                        <div class="contact-card-icon">
                            <i class="fab fa-linkedin-in" aria-hidden="true"></i>
                        </div>
                        <div class="contact-card-text">
                            <span class="contact-card-label">LinkedIn</span>
                            <span class="contact-card-value">Justine BLIN</span>
                        </div>
                        <i class="fas fa-arrow-right contact-card-arrow" aria-hidden="true"></i>
                    </a>

                    <a href="https://github.com/JustineB24" target="_blank"
                       rel="noopener noreferrer" class="contact-card">
                        <div class="contact-card-icon">
                            <i class="fab fa-github" aria-hidden="true"></i>
                        </div>
                        <div class="contact-card-text">
                            <span class="contact-card-label">GitHub</span>
                            <span class="contact-card-value">JustineB24</span>
                        </div>
                        <i class="fas fa-arrow-right contact-card-arrow" aria-hidden="true"></i>
                    </a>
                </div>

            </aside>
        </div>
    </section>
</main>

<script src="../js/contact.js" defer></script>
</body>

</html>
