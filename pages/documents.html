<!--
    Ancienne URL de la page « BTS SIO », devenue « Formation » le 05/08/2026
    (elle couvre maintenant le Bachelor en plus du BTS, et accueillera le
    mastère). GitHub Pages ne sait pas faire de redirection 301 côté serveur,
    donc on garde ce fichier comme relais :

      - `canonical` désigne la nouvelle page pour les moteurs de recherche ;
      - `noindex` évite que ce relais soit indexé à sa place ;
      - le `refresh` redirige les visiteurs venus d'un ancien lien ;
      - le lien visible sert de repli si le refresh est bloqué.

    Ce fichier n'est volontairement PAS dans sitemap.xml. Il pourra être
    supprimé une fois que les anciens liens auront disparu des index.
-->

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://justineb24.github.io/Portfolio/pages/formation.html">
    <meta http-equiv="refresh" content="0; url=formation.html">
    <meta name="description" content="Cette page a été remplacée par la page Formation.">
    <link rel="icon" type="image/png" href="../assets/Logo_portfolio.png">
    <link rel="stylesheet" href="../assets/fonts/google/fonts.css">
    <link rel="stylesheet" href="../css/global.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/theme.css" media="all" type="text/css">
    <script>try {
        let dm = localStorage.getItem('dark-mode');
        if (dm === 'true' || (dm === null && window.matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.classList.add('dark-theme')
    } catch (e) {
    }</script>

    <title>Page déplacée | Portfolio</title>
</head>

<body>
<main id="main">
    <p class="section-eyebrow">Page déplacée</p>
    <h1>Formation</h1>
    <p class="sous-titre-page">La page « BTS SIO » est devenue « Formation » : elle regroupe désormais le
        Bachelor et le BTS SIO. Si la redirection ne se fait pas automatiquement,
        <a href="formation.html">ouvrez la page Formation</a>.</p>
</main>
</body>

</html>
