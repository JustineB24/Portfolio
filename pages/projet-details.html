<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Détails d'un projet réalisé par Justine BLIN.">
    <meta name="author" content="Justine BLIN">
    <meta name="theme-color" content="#a90000">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portfolio | Détails du projet">
    <meta property="og:description" content="Détails d'un projet réalisé par Justine BLIN.">
    <meta property="og:image" content="https://justineb24.github.io/Portfolio/assets/og/og-projet-details.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Détail d'un projet de Justine Blin">
    <meta property="og:url" content="https://justineb24.github.io/Portfolio/pages/projet-details.html">
    <link rel="canonical" href="https://justineb24.github.io/Portfolio/pages/projet-details.html">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Portfolio | Détails du projet">
    <meta name="twitter:description" content="Détails d'un projet réalisé par Justine BLIN.">
    <meta name="twitter:image" content="https://justineb24.github.io/Portfolio/assets/og/og-projet-details.jpg">
    <link rel="icon" type="image/png" href="../assets/Logo_portfolio.png">
    <link rel="stylesheet" href="../assets/fonts/fa/css/all.min.css"
          media="print" onload="this.media='all'">
    <link rel="preload" href="../assets/fonts/google/raleway-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/google/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/fonts/google/fonts.css">
    <link rel="stylesheet" href="../css/global.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/technos.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/theme.css" media="all" type="text/css">
    <link rel="stylesheet" href="../css/projet-details.css" media="all" type="text/css">
    <script>try {
        let dm = localStorage.getItem('dark-mode');
        if (dm === 'true' || (dm === null && window.matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.classList.add('dark-theme')
    } catch (e) {
    }</script>
    <script src="../js/structure-globale.js" defer></script>

    <title>Portfolio | Détails du projet</title>
</head>

<body>
<!-- Contenu principal -->
<main id="main">
    <div class="projet-details">

        <!-- Hero du projet -->
        <div class="projet-hero" id="projet-hero">
            <a href="projets.html" class="back-button" aria-label="Retour aux projets">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Retour
            </a>
            <h1 id="projet-title"></h1>
            <!-- date + badge "en cours" injectés ici par le JS, après le titre -->
        </div>

        <!-- Colonne de lecture éditoriale -->
        <div class="projet-wrap">

            <!-- Barre méta : technologies du projet -->
            <div class="projet-meta">
                <span class="eyebrow">Technologies</span>
                <ul id="projet-technologies">
                    <!-- Liste insérée en JS -->
                </ul>
            </div>

            <!-- Présentation -->
            <section class="projet-section">
                <p class="eyebrow">Le projet</p>
                <h2 class="projet-section-titre">Présentation</h2>
                <p id="projet-description" class="projet-lead"></p>
                <!-- `hidden` par défaut : le JS le retire seulement si le projet a un lien. -->
                <div id="projet-link" hidden></div>
            </section>

            <!-- Étude de cas insérée ici par le JS, avant #projet-apercu -->

            <!-- Aperçu -->
            <section class="projet-section" id="projet-apercu">
                <p class="eyebrow">Galerie</p>
                <h2 class="projet-img">Aperçu du projet</h2>
                <div id="projet-images">
                    <!-- Images insérées en JS -->
                </div>
            </section>

        </div>
    </div>
</main>

<!-- Lien JS -->
<script src="../js/projet-details.js" defer></script>
</body>

</html>
