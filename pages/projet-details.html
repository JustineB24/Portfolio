<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- Script pour générer le head commun (meta, css global, favicon) -->
    <script src="../js/structure-globale.js"></script>
    <script>genererHead("../");</script>

    <!-- CSS spécifique -->
    <link rel="stylesheet" href="../css/projet-details.css" media="all" type="text/css">

    <title>Portfolio | Détails du projet</title>
</head>

<body>
    <script>
        genererHeader("../");
    </script>

    <!-- Contenu principal -->
    <main>
        <div class="projet-details">

            <!-- Titre du projet et flèche retour -->
            <div class="title-container">
                <a href="projets.html" class="back-button">
                    <img class="fleche" src="../assets/fleche-projet.png" alt="Retour aux projets">
                </a>
                <h1 id="projet-title"></h1>
            </div>

            <!-- Conteneur pour les blocs -->
            <div class="projet-content">
                <!-- Bloc Présentation -->
                <div class="projet-presentation">
                    <h2 class="title-blocs">Présentation du projet :</h2>
                    <p id="projet-description"></p>
                    <!-- Lien pour voir le projet en ligne -->
                    <div id="projet-link"></div>
                </div>

                <!-- Bloc Technologies -->
                <div class="projet-technologies">
                    <h2 class="title-blocs">Technologies utilisées :</h2>
                    <ul id="projet-technologies">
                        <!-- Liste insérée en JS -->
                    </ul>
                </div>
            </div>

            <!-- Image du projet -->
            <h2 class="projet-img">Aperçu du projet :</h2>
            <div id="projet-images">
                <!-- Images insérées en JS -->
            </div>
        </div>
    </main>

    <script>
        genererFooter("../");
    </script>

    <!-- Lien JS -->
    <script src="../js/projet-details.js"></script>
</body>

</html>
